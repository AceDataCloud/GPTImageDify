identity:
  name: gpt_image_edit_image
  author: acedatacloud
  label:
    en_US: GPT Image Edit Image
    zh_Hans: GPT Image 编辑图片
description:
  human:
    en_US: GPT Image Edit Image via Ace Data Cloud.
    zh_Hans: 通过 Ace Data Cloud GPT Image 编辑图片。
  llm: GPT Image Edit Image via Ace Data Cloud. For asynchronous results, preserve
    task_id and use the task retrieval tool until completion. A successful submission
    is not completed output.
parameters:
- name: image_urls
  type: string
  required: true
  form: form
  label:
    en_US: Reference image URLs
    zh_Hans: 参考图片链接
  human_description:
    en_US: Public HTTPS image URLs, one per line or a JSON array. Only submit images
      you may use. Enter a JSON array or object where applicable. Enter a JSON array
      or object where applicable. Enter a JSON array or object where applicable. Enter
      a JSON array or object where applicable. Enter a JSON array or object where
      applicable.
    zh_Hans: 参考图像 URL。接受单个 URL 字符串或 URL 字符串数组（GPT Image 系列模型最多 16 个，`dall-e-2` 仅支持
      1 个）。JSON 模式**不**接受上传的文件字节——如需直接上传文件，请使用 `multipart/form-data`。 数组或对象请使用 JSON
      格式。
  llm_description: Public HTTPS image URLs, one per line or a JSON array. Only submit
    images you may use. Enter a JSON array or object where applicable. Enter a JSON
    array or object where applicable. Enter a JSON array or object where applicable.
    Enter a JSON array or object where applicable. Enter a JSON array or object where
    applicable.
- name: prompt
  type: string
  required: true
  form: llm
  label:
    en_US: Prompt
    zh_Hans: 提示词
  human_description:
    en_US: Prompt
    zh_Hans: 描述所需编辑效果的文本。`dall-e-2` 最多 1000 个字符，GPT Image 系列模型最多 32000 个字符。
  llm_description: Prompt
- name: model
  type: select
  required: false
  form: form
  label:
    en_US: Model
    zh_Hans: 模型
  human_description:
    en_US: Select a model currently supported by this API. Availability and pricing
      depend on the chosen model.
    zh_Hans: 图像编辑所用模型。支持 `dall-e-2`、`dall-e-3`、GPT Image 系列（`gpt-image-1`、`gpt-image-1.5`、`gpt-image-2`、`gpt-image-2.5-flare`、`gpt-image-2.5-sunburst`）以及
      Google Nano Banana 系列（`nano-banana`、`nano-banana-2-lite`、`nano-banana-2`、`nano-banana-pro`）。`gpt-image-2`
      提供 `gpt-image-2:official`（官方通道，稳定合规，按文字输入、图片输入与图片输出的实际 Token 用量结算）与 `gpt-image-2:reverse`（等同默认
      `gpt-image-2`，性价比更高）；`gpt-image-2.5-flare` 和 `gpt-image-2.5-sunburst` 也分别提供同名
      `:official` 变体，并按实际 Token 用量结算。
  llm_description: Select a model currently supported by this API. Availability and
    pricing depend on the chosen model.
  default: gpt-image-2
  options:
  - value: dall-e-2
    label:
      en_US: dall-e-2
      zh_Hans: dall-e-2
  - value: dall-e-3
    label:
      en_US: dall-e-3
      zh_Hans: dall-e-3
  - value: gpt-image-1
    label:
      en_US: gpt-image-1
      zh_Hans: gpt-image-1
  - value: gpt-image-1.5
    label:
      en_US: gpt-image-1.5
      zh_Hans: gpt-image-1.5
  - value: gpt-image-2
    label:
      en_US: gpt-image-2
      zh_Hans: gpt-image-2
  - value: gpt-image-2.5-flare
    label:
      en_US: gpt-image-2.5-flare
      zh_Hans: gpt-image-2.5-flare
  - value: gpt-image-2.5-flare:official
    label:
      en_US: gpt-image-2.5-flare:official
      zh_Hans: gpt-image-2.5-flare:official
  - value: gpt-image-2.5-sunburst
    label:
      en_US: gpt-image-2.5-sunburst
      zh_Hans: gpt-image-2.5-sunburst
  - value: gpt-image-2.5-sunburst:official
    label:
      en_US: gpt-image-2.5-sunburst:official
      zh_Hans: gpt-image-2.5-sunburst:official
  - value: gpt-image-2:reverse
    label:
      en_US: gpt-image-2:reverse
      zh_Hans: gpt-image-2:reverse
  - value: gpt-image-2:official
    label:
      en_US: gpt-image-2:official
      zh_Hans: gpt-image-2:official
  - value: nano-banana
    label:
      en_US: nano-banana
      zh_Hans: nano-banana
  - value: nano-banana-2-lite
    label:
      en_US: nano-banana-2-lite
      zh_Hans: nano-banana-2-lite
  - value: nano-banana-2
    label:
      en_US: nano-banana-2
      zh_Hans: nano-banana-2
  - value: nano-banana-pro
    label:
      en_US: nano-banana-pro
      zh_Hans: nano-banana-pro
- name: count
  type: number
  required: false
  form: form
  label:
    en_US: Image count
    zh_Hans: 图片数量
  human_description:
    en_US: Number of images to generate; each image is billed at the current service
      rate.
    zh_Hans: 生成图像的数量（1-10）。`dall-e-3` 固定为 `1`。`dall-e-2`、`gpt-image-1` / `gpt-image-1.5`
      / `gpt-image-2` / `gpt-image-2.5-flare` / `gpt-image-2.5-sunburst` 系列以及 `nano-banana`
      / `nano-banana-2-lite` / `nano-banana-2` / `nano-banana-pro` 系列均支持 `n>1`：默认模型与
      `:reverse` 按成功张数计费，`:official` 按整次响应汇总的实际 Token 用量结算，不会重复乘以 `n`。注意 `response_format=b64_json`
      仅支持 `n=1`，`n>1` 时请使用默认的 URL 返回。若部分图片生成失败，将只返回并计费成功的部分。
  llm_description: Number of images to generate; each image is billed at the current
    service rate.
  default: 1
  min: 1
  max: 10
- name: background
  type: select
  required: false
  form: form
  label:
    en_US: Background
    zh_Hans: 背景
  human_description:
    en_US: Set background for this operation.
    zh_Hans: 仅适用于 GPT Image 系列模型。透明度处理方式：`transparent`（透明）、`opaque`（不透明）或 `auto`（自动）。
  llm_description: Set background for this operation.
  options:
  - value: transparent
    label:
      en_US: transparent
      zh_Hans: transparent
  - value: opaque
    label:
      en_US: opaque
      zh_Hans: opaque
  - value: auto
    label:
      en_US: auto
      zh_Hans: auto
- name: input_fidelity
  type: select
  required: false
  form: form
  label:
    en_US: Input Fidelity
    zh_Hans: 输入保真度
  human_description:
    en_US: Set input fidelity for this operation.
    zh_Hans: 对输入图像风格和特征的匹配强度。`gpt-image-1` 与 `gpt-image-1.5` 支持；`gpt-image-1-mini`
      与 GPT Image 2 系列会忽略此参数。
  llm_description: Set input fidelity for this operation.
  options:
  - value: high
    label:
      en_US: high
      zh_Hans: high
  - value: low
    label:
      en_US: low
      zh_Hans: low
- name: output_format
  type: select
  required: false
  form: form
  label:
    en_US: Output Format
    zh_Hans: 输出格式
  human_description:
    en_US: Set output format for this operation.
    zh_Hans: GPT Image 系列模型的返回格式：`png`、`jpeg` 或 `webp`。
  llm_description: Set output format for this operation.
  options:
  - value: png
    label:
      en_US: png
      zh_Hans: png
  - value: jpeg
    label:
      en_US: jpeg
      zh_Hans: jpeg
  - value: webp
    label:
      en_US: webp
      zh_Hans: webp
- name: output_compression
  type: number
  required: false
  form: form
  label:
    en_US: Output Compression
    zh_Hans: 输出压缩质量
  human_description:
    en_US: Set output compression for this operation.
    zh_Hans: '`webp` 或 `jpeg` 输出时的压缩等级（0-100%）。'
  llm_description: Set output compression for this operation.
  min: 0
  max: 100
- name: quality
  type: select
  required: false
  form: form
  label:
    en_US: Quality
    zh_Hans: 质量
  human_description:
    en_US: Quality
    zh_Hans: 图像质量。GPT Image 系列模型支持：`auto`、`high`、`medium`、`low`。
  llm_description: Quality
  default: auto
  options:
  - value: auto
    label:
      en_US: auto
      zh_Hans: auto
  - value: high
    label:
      en_US: high
      zh_Hans: high
  - value: medium
    label:
      en_US: medium
      zh_Hans: medium
  - value: low
    label:
      en_US: low
      zh_Hans: low
  - value: standard
    label:
      en_US: standard
      zh_Hans: standard
- name: size
  type: string
  required: false
  form: form
  label:
    en_US: Image size
    zh_Hans: 图片尺寸
  human_description:
    en_US: auto or WIDTHxHEIGHT; valid sizes depend on the model.
    zh_Hans: 图像尺寸，格式为 `WIDTHxHEIGHT`，或 `auto`。**GPT Image 2 系列（`gpt-image-2`、`gpt-image-2.5-flare`、`gpt-image-2.5-sunburst`）**接受任意符合该格式的
      `WIDTHxHEIGHT` 值，包括 1K 预设（`1024x1024`、`1536x1024`、`1024x1536`、`1792x1024`、`1024x1792`）、2K
      预设（`2048x2048`、`2048x1536`、`1536x2048`、`2048x1152`、`1152x2048`）、4K 预设（`2880x2880`、`3264x2448`、`2448x3264`、`3840x2160`、`2160x3840`）以及自定义尺寸；默认模型与
      `:reverse` 按张计费，只有 `:official` 的尺寸和质量会影响 Token 用量并按实际用量结算。尺寸限制：自定义尺寸须为 16 的倍数，长边
      ≤ 3840，总像素数为 655,360–8,294,400，宽高比不超过 3:1。`dall-e-2` 支持：`256x256`、`512x512`、`1024x1024`。省略
      `size` 字段与显式传入 `auto` 完全等价：GPT Image 2 系列会先从提示词识别明确的像素、比例、横竖方向、分辨率档（如 4K / high-res）或命名画布；识别到尺寸意图时采用规划后的具体尺寸，提示词没有尺寸要求或自动判断不可用时回退到第一张参考图的尺寸。最终尺寸会归一化到上述限制；需要绝对控制时请直接传
      `WIDTHxHEIGHT`。
  llm_description: auto or WIDTHxHEIGHT; valid sizes depend on the model.
  default: 1024x1024
- name: callback_url
  type: string
  required: false
  form: form
  label:
    en_US: Callback Url
    zh_Hans: 回调 URL
  human_description:
    en_US: Set callback url for this operation.
    zh_Hans: 可选的回调 URL。提供后，接口立即返回 `task_id`，并在图像编辑完成后以 POST 方式将结果推送至该 URL。
  llm_description: Set callback url for this operation.
output_schema:
  type: object
  properties:
    status:
      type: string
    success:
      type: boolean
    task_id:
      type: string
    trace_id:
      type: string
    media_urls:
      type: array
      items:
        type: string
    data: {}
    result:
      type: object
extra:
  python:
    source: tools/gpt_image_edit.py
